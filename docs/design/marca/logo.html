<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Logo · Radar Boi</title>
<style>
html,body{margin:0;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.l{display:none;align-items:center;gap:22px;padding:24px;font-weight:800;font-size:76px;letter-spacing:-1.5px;line-height:1}
.ic{width:120px;height:120px;border-radius:32px;display:grid;place-items:center;flex:none}
.ic svg{width:78%;height:78%}
.verde .ic{background:#1f4d2b}.verde .ic svg{color:#ffd54a}.verde span{color:#163a20}
.claro .ic{background:#ffd54a}.claro .ic svg{color:#1f4d2b}.claro span{color:#fff}
.q{display:none;width:1024px;height:1024px;place-items:center}
.q svg{width:66%;height:66%}
.q.v{background:#1f4d2b;color:#ffd54a}.q.a{background:#ffd54a;color:#1f4d2b}
body.s-verde .l.verde,body.s-claro .l.claro{display:inline-flex}
body.s-iv .q.v,body.s-ia .q.a{display:grid}
</style></head>
<body>
<script>document.body.className='s-'+(location.hash.slice(1)||'verde')</script>
<div class="l verde"><div class="ic"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="50" cy="50" r="19" fill="none" stroke="currentColor" stroke-width="9"/></svg></div><span>Radar Boi</span></div>
<div class="l claro"><div class="ic"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="50" cy="50" r="19" fill="none" stroke="currentColor" stroke-width="9"/></svg></div><span>Radar Boi</span></div>
<div class="q v"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="50" cy="50" r="19" fill="none" stroke="currentColor" stroke-width="9"/></svg></div>
<div class="q a"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="9"/><circle cx="50" cy="50" r="19" fill="none" stroke="currentColor" stroke-width="9"/></svg></div>
</body></html>
